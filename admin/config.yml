backend:
  name: github
  repo: lgrassu/harul-website
  branch: main
  base_url: https://harul-cms-login.lgrassu.workers.dev
  auth_endpoint: auth

media_folder: "images"
public_folder: "/images"

collections:
  - name: "site-text"
    label: "Texte pagina principală / Homepage text"
    files:
      - label: "Texte principale"
        name: "site-text"
        file: "site-text.json"
        fields:
          - { label: "Mesaj scurt de bun venit (Română)", name: "hero_eyebrow_ro", widget: "string" }
          - { label: "Short welcome tagline (English)", name: "hero_eyebrow_en", widget: "string" }
          - { label: "Titlu principal (Română)", name: "hero_headline_ro", widget: "string" }
          - { label: "Main headline (English)", name: "hero_headline_en", widget: "string" }
          - { label: "Text de bun venit (Română)", name: "hero_lead_ro", widget: "text" }
          - { label: "Welcome text (English)", name: "hero_lead_en", widget: "text" }
          - { label: "Despre biserică - paragraf 1 (Română)", name: "about_p1_ro", widget: "text" }
          - { label: "About - paragraph 1 (English)", name: "about_p1_en", widget: "text" }
          - { label: "Despre biserică - paragraf 2 (Română)", name: "about_p2_ro", widget: "text" }
          - { label: "About - paragraph 2 (English)", name: "about_p2_en", widget: "text" }
          - { label: "Text scurt despre noi (pagina principală) (Română)", name: "about_teaser_ro", widget: "text" }
          - { label: "Short about teaser (homepage) (English)", name: "about_teaser_en", widget: "text" }
          - { label: "Valoare 1 - titlu (Română)", name: "value1_title_ro", widget: "string" }
          - { label: "Value 1 - title (English)", name: "value1_title_en", widget: "string" }
          - { label: "Valoare 1 - text (Română)", name: "value1_body_ro", widget: "string" }
          - { label: "Value 1 - text (English)", name: "value1_body_en", widget: "string" }
          - { label: "Valoare 2 - titlu (Română)", name: "value2_title_ro", widget: "string" }
          - { label: "Value 2 - title (English)", name: "value2_title_en", widget: "string" }
          - { label: "Valoare 2 - text (Română)", name: "value2_body_ro", widget: "string" }
          - { label: "Value 2 - text (English)", name: "value2_body_en", widget: "string" }
          - { label: "Valoare 3 - titlu (Română)", name: "value3_title_ro", widget: "string" }
          - { label: "Value 3 - title (English)", name: "value3_title_en", widget: "string" }
          - { label: "Valoare 3 - text (Română)", name: "value3_body_ro", widget: "string" }
          - { label: "Value 3 - text (English)", name: "value3_body_en", widget: "string" }
          - { label: "Descriere serviciu duminică dimineața (Română)", name: "service1_body_ro", widget: "text" }
          - { label: "Sunday morning service description (English)", name: "service1_body_en", widget: "text" }
          - { label: "Descriere serviciu duminică seara (Română)", name: "service2_body_ro", widget: "text" }
          - { label: "Sunday evening service description (English)", name: "service2_body_en", widget: "text" }
          - { label: "Descriere serviciu vineri (Română)", name: "service3_body_ro", widget: "text" }
          - { label: "Friday service description (English)", name: "service3_body_en", widget: "text" }
          - { label: "Titlu secțiune Dăruire (Română)", name: "give_heading_ro", widget: "string" }
          - { label: "Give section heading (English)", name: "give_heading_en", widget: "string" }
          - { label: "Text secțiune Dăruire (Română)", name: "give_text_ro", widget: "text" }
          - { label: "Give section text (English)", name: "give_text_en", widget: "text" }
          - { label: "Titlu secțiune Istoric (Română)", name: "history_eyebrow_ro", widget: "string" }
          - { label: "History section eyebrow (English)", name: "history_eyebrow_en", widget: "string" }
          - { label: "Titlu principal Istoric (Română)", name: "history_h2_ro", widget: "string" }
          - { label: "History section heading (English)", name: "history_h2_en", widget: "string" }
          - { label: "Text Istoric (Română)", name: "history_text_ro", widget: "text" }
          - { label: "History text (English)", name: "history_text_en", widget: "text" }

  - name: "board"
    label: "Conducere / Leadership"
    files:
      - label: "Membri conducere"
        name: "board"
        file: "board.json"
        fields:
          - label: "Membri"
            name: "members"
            widget: "list"
            fields:
              - { label: "Fotografie", name: "photo", widget: "image", required: false }
              - { label: "Nume", name: "name", widget: "string" }
              - { label: "Rol (Română)", name: "title_ro", widget: "string" }
              - { label: "Role (English)", name: "title_en", widget: "string" }

  - name: "events"
    label: "Evenimente / Events (ocazii speciale — botez, nuntă, sărbători)"
    files:
      - label: "Lista de evenimente"
        name: "events"
        file: "events.json"
        fields:
          - label: "Evenimente"
            name: "events"
            widget: "list"
            fields:
              - { label: "Dată", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { label: "Ora (opțional, ex: 18:00 sau 6:00 PM)", name: "time", widget: "string", required: false }
              - { label: "Titlu (Română)", name: "title_ro", widget: "string" }
              - { label: "Title (English)", name: "title_en", widget: "string" }
              - { label: "Descriere (Română)", name: "description_ro", widget: "text" }
              - { label: "Description (English)", name: "description_en", widget: "text" }

  - name: "sermons"
    label: "Predici / Sermons"
    files:
      - label: "Lista de predici"
        name: "sermons"
        file: "sermons.json"
        fields:
          - label: "Predici"
            name: "sermons"
            widget: "list"
            fields:
              - { label: "Dată", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { label: "Titlu (Română)", name: "title_ro", widget: "string" }
              - { label: "Title (English)", name: "title_en", widget: "string" }
              - { label: "Descriere (Română)", name: "description_ro", widget: "text" }
              - { label: "Description (English)", name: "description_en", widget: "text" }

  - name: "settings"
    label: "Contact & Program / Settings"
    files:
      - label: "Detalii biserică"
        name: "settings"
        file: "settings.json"
        fields:
          - { label: "Adresă / Address", name: "address", widget: "string" }
          - { label: "Telefon / Phone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Program duminică dimineața / Sunday AM", name: "sun_am", widget: "string" }
          - { label: "Program duminică seara / Sunday PM", name: "sun_pm", widget: "string" }
          - { label: "Program vineri / Friday", name: "friday", widget: "string" }
          - label: "Program săptămânal (pentru caseta Calendar) / Weekly meetings (for the Calendar box)"
            name: "weekly_schedule"
            widget: "list"
            fields:
              - { label: "Zi / Day", name: "day", widget: "select", options: ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"] }
              - { label: "Oră / Time", name: "time", widget: "string" }
              - { label: "Denumire (Română)", name: "label_ro", widget: "string" }
              - { label: "Label (English)", name: "label_en", widget: "string" }
          - { label: "Google Calendar ID", name: "google_calendar_id", widget: "string", required: false, hint: "Programul recurent (duminici, miercuri, vineri) — se preia automat din Google Calendar, nu de aici." }
          - { label: "Google API Key (Calendar + YouTube)", name: "google_api_key", widget: "string", required: false, hint: "Din Google Cloud Console → Credentials. Activați atât Calendar API cât și YouTube Data API v3 pe această cheie." }
          - { label: "ID canal YouTube", name: "youtube_channel_id", widget: "string", required: false, hint: "Găsit în adresa canalului: youtube.com/channel/ACEST-ID" }

  # Written by the Apps Script from the Credo Translation email.
  # Editors review, fix any mishearings, then flip "Publicat" to show it.
  - name: "sermon-notes"
    label: "Rezumate predici / Sermon notes"
    folder: "sermons"
    extension: "json"
    format: "json"
    create: false
    delete: true
    identifier_field: "service_date"
    summary: "{{service_date}} — {{ro.title}}"
    sortable_fields: ["service_date"]
    fields:
      - { label: "Data serviciului", name: "service_date", widget: "string" }
      - { label: "Publicat pe site / Published", name: "published", widget: "boolean", default: false }
      - label: "Română"
        name: "ro"
        widget: "object"
        fields:
          - { label: "Titlu", name: "title", widget: "string" }
          - { label: "Tema", name: "theme", widget: "text" }
          - { label: "Pe scurt", name: "summary", widget: "text" }
          - label: "Ideile principale"
            name: "points"
            widget: "list"
            summary: "{{fields.heading}}"
            fields:
              - { label: "Titlu", name: "heading", widget: "string", required: false }
              - { label: "Conținut", name: "body", widget: "text" }
          - label: "Versete-cheie"
            name: "key_verses"
            widget: "list"
            field: { label: "Verset", name: "verse", widget: "string" }
          - { label: "Pentru săptămâna aceasta", name: "application", widget: "text", required: false }
      - label: "English"
        name: "en"
        widget: "object"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Theme", name: "theme", widget: "text" }
          - { label: "In short", name: "summary", widget: "text" }
          - label: "Main points"
            name: "points"
            widget: "list"
            summary: "{{fields.heading}}"
            fields:
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Body", name: "body", widget: "text" }
          - label: "Key verses"
            name: "key_verses"
            widget: "list"
            field: { label: "Verse", name: "verse", widget: "string" }
          - { label: "For this week", name: "application", widget: "text", required: false }
      # Kept so Decap does not strip them when an editor saves.
      - { label: "schema", name: "schema", widget: "hidden", default: "credo.sermon.v1" }
      - { label: "source_format", name: "source_format", widget: "hidden", required: false }
      - { label: "email_received", name: "email_received", widget: "hidden", required: false }
