backend:
  name: github
  repo: lgrassu/harul-website
  branch: main
  base_url: https://harul-cms-login.lgrassu.workers.dev
  auth_endpoint: auth

media_folder: "images"
public_folder: "/images"

collections:
  - name: "board"
    label: "Conducere / Leadership"
    files:
      - label: "Membri conducere"
        name: "board"
        file: "content/board.json"
        fields:
          - label: "Membri"
            name: "members"
            widget: "list"
            fields:
              - { label: "Fotografie", name: "photo", widget: "image", required: false }
              - { label: "Nume", name: "name", widget: "string" }
              - { label: "Rol (Română)", name: "title_ro", widget: "string" }
              - { label: "Role (English)", name: "title_en", widget: "string" }

  - name: "events"
    label: "Evenimente / Events"
    files:
      - label: "Lista de evenimente"
        name: "events"
        file: "content/events.json"
        fields:
          - label: "Evenimente"
            name: "events"
            widget: "list"
            fields:
              - { label: "Dată", name: "date", widget: "date", format: "YYYY-MM-DD" }
              - { label: "Titlu (Română)", name: "title_ro", widget: "string" }
              - { label: "Title (English)", name: "title_en", widget: "string" }
              - { label: "Descriere (Română)", name: "description_ro", widget: "text" }
              - { label: "Description (English)", name: "description_en", widget: "text" }

  - name: "sermons"
    label: "Predici / Sermons"
    files:
      - label: "Lista de predici"
        name: "sermons"
        file: "content/sermons.json"
        fields:
          - label: "Predici"
            name: "sermons"
            widget: "list"
            fields:
              - { label: "Dată", name: "date", widget: "date", format: "YYYY-MM-DD" }
              - { label: "Titlu (Română)", name: "title_ro", widget: "string" }
              - { label: "Title (English)", name: "title_en", widget: "string" }
              - { label: "Descriere (Română)", name: "description_ro", widget: "text" }
              - { label: "Description (English)", name: "description_en", widget: "text" }

  - name: "settings"
    label: "Contact & Program / Settings"
    files:
      - label: "Detalii biserică"
        name: "settings"
        file: "content/settings.json"
        fields:
          - { label: "Adresă / Address", name: "address", widget: "string" }
          - { label: "Telefon / Phone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Program duminică dimineața / Sunday AM", name: "sun_am", widget: "string" }
          - { label: "Program duminică seara / Sunday PM", name: "sun_pm", widget: "string" }
          - { label: "Program vineri / Friday", name: "friday", widget: "string" }
